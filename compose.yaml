services:
  site:
    image: nginx:alpine
    ports:
      - "${TARA_PORT:-8001}:80"
    volumes:
      - type: bind
        source: ./index.html
        target: /usr/share/nginx/html/index.html
        read_only: true
      - type: bind
        source: ./about.html
        target: /usr/share/nginx/html/about.html
        read_only: true
      - type: bind
        source: ./app.html
        target: /usr/share/nginx/html/app.html
        read_only: true
      - type: bind
        source: ./CHANGELOG.md
        target: /usr/share/nginx/html/CHANGELOG.md
        read_only: true
      - type: bind
        source: ./sitemap.xml
        target: /usr/share/nginx/html/sitemap.xml
        read_only: true
      - type: bind
        source: ./assets
        target: /usr/share/nginx/html/assets
        read_only: true
      - type: bind
        source: ./en
        target: /usr/share/nginx/html/en
        read_only: true
      - type: bind
        source: ./fa
        target: /usr/share/nginx/html/fa
        read_only: true
      - type: bind
        source: ./img
        target: /usr/share/nginx/html/img
        read_only: true

  css:
    profiles: ["dev"]
    image: tara-guitarlab-css:dev
    build:
      context: .
      dockerfile: Dockerfile.css
    volumes:
      - type: bind
        source: ./tailwind.config.cjs
        target: /workspace/tailwind.config.cjs
        read_only: true
      - type: bind
        source: ./index.html
        target: /workspace/index.html
        read_only: true
      - type: bind
        source: ./fa/index.html
        target: /workspace/fa/index.html
        read_only: true
      - type: bind
        source: ./assets/css/tailwind-input.css
        target: /workspace/assets/css/tailwind-input.css
        read_only: true
      - type: bind
        source: ./assets/css/tailwind.min.css
        target: /workspace/assets/css/tailwind.min.css
